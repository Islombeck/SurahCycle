name: murajaah
description: A local-first Quran revision and learning companion.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  home_widget: 0.9.3
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  crypto: ^3.0.7
  http: ^1.6.0
  adhan_dart: 2.0.1
  geolocator: 14.0.3
  path_provider: 2.1.6
  # Flutter 3.44.7 pins this through flutter_localizations.
  intl: 0.20.2
  uuid: ^4.6.0
  xml: ^7.0.1
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 2.15.2+ requires a newer meta than Flutter 3.44.7 pins.
  build_runner: 2.15.1
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/quran/quran-data.xml
    - assets/quran/quran-transliteration-en.txt
    - assets/quran/quran-uthmani.txt
    - assets/quran/TANZIL_TEXT_LICENSE.txt
    - assets/quran/TANZIL_TRANSLITERATION_LICENSE.txt
