org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP resolves the ASCII workspace junction to the Cyrillic physical path.
android.overridePathCheck=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Avoid duplicate Kotlin daemon cache registrations when this checkout is
# built through an ASCII SUBST drive on Windows.
kotlin.compiler.execution.strategy=in-process
# Same cause, later symptom: through the SUBST drive, Kotlin's incremental
# caches cannot be closed at the end of a module —
# «Could not close incremental caches ... class-fq-name-to-source.tab» — and
# every module after the first fails in turn. Incremental compilation is a
# build-speed feature and nothing else, so the APK this produces is the same
# APK; the cost is a full recompile each time.
kotlin.incremental=false
